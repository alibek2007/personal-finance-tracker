# A complete single-host deployment: PostgreSQL + API + web (nginx).
#
#   cp .env.production.example .env.production      # then edit it
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# Put TLS in front of the `web` service (port 8080). For several hosts or managed PostgreSQL, run the
# api and web images on their own and point DATABASE_URL at the managed database.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pfm}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pfm}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (48+ random characters)}
      WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS to the public https origin}
      COOKIE_SECURE: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: 'true'
    expose: ['4000']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports: ['${WEB_PORT:-8080}:8080']

volumes:
  pgdata:
