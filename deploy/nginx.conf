# Serves the built web app and forwards /api to the API container (same origin, so cookies just work).
# Terminate TLS in front of this (a load balancer, Caddy, Traefik, your host's edge): the app expects
# to be reached over HTTPS in production (COOKIE_SECURE=true).

upstream ledger_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 3m;   # CSV import is sent as text, up to 2 MB

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers. The API sets its own on /api responses; these cover the app shell.
  # style-src needs 'unsafe-inline' because the charting library writes inline SVG styles.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://ledger_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Fingerprinted build output never changes: cache it for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location drops the server-level ones, so repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The shell must always be revalidated so a new release is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Single-page app: any other path is a client-side route.
  location / {
    try_files $uri /index.html;
  }
}
